[package]
name = "p2pssh"
version = "0.1.0"
edition = "2024"
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
rust-version = "1.89"
readme = "README.md"

[[bin]]
name = "p2pssh"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
lexopt = { version = "0.3", default-features = false }
iroh = { version = "0.96", default-features = false }
quinn = { version = "0.16", package = "iroh-quinn", default-features = false, features = ["runtime-tokio", "ring"] }
tokio = { version = "1.41", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "macros", "fs", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
rand = { version = "0.9", features = ["thread_rng"] }
z32 = { version = "1.3", default-features = false }
hostname = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
