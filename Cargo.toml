[package]
name = "p2pssh"
version = "0.1.0"
edition = "2024"
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
rust-version = "1.89"
readme = "README.md"

[[bin]]
name = "p2pssh"
path = "src/main.rs"

[lib]
name = "p2pssh"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
lexopt = { version = "0.3.2", default-features = false }
iroh = { version = "1.0.0-rc.0", default-features = false, features = ["tls-ring"] }
noq = "1.0.0-rc.0"
iroh-mdns-address-lookup = "0.2.0"
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "macros", "fs", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }
rand = { version = "0.9.4", features = ["thread_rng"] }
z32 = { version = "1.3", default-features = false }
hostname = { version = "0.4.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.186", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
